services:
  backend:
    image: ide-backend:${BACKEND_IMAGE_TAG:?BACKEND_IMAGE_TAG is required}
    build:
      context: /opt/innoprog/apps/innoprog-room-microservice
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${BACKEND_IMAGE_REVISION:?BACKEND_IMAGE_REVISION is required}
    container_name: ide-backend-1
    labels:
      org.opencontainers.image.revision: ${BACKEND_IMAGE_REVISION:?BACKEND_IMAGE_REVISION is required}
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    read_only: true
    user: "1000:1000"
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777,uid=1000,gid=1000
    env_file:
      - /opt/innoprog/apps/innoprog-room-microservice/.env
    environment:
      IDE_ROOMS_REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    labels:
      org.opencontainers.image.revision: redis-7.4.9-6ab0b6e73817
    container_name: ide-redis-1
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    read_only: true
    # The official entrypoint repairs fresh/restored /data ownership, then
    # drops to the image's redis user before starting the server.
    pids_limit: 128
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      # Redis creates AOF directories with mode 0700; the entrypoint must
      # traverse them on restart before dropping to the redis UID.
      - DAC_READ_SEARCH
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges=true
    volumes:
      - /opt/innoprog/data/ide-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    image: ide-frontend:${FRONTEND_IMAGE_TAG:?FRONTEND_IMAGE_TAG is required}
    build:
      context: /opt/innoprog/apps/INNOPROG-IDE
      dockerfile: Dockerfile
      args:
        REACT_APP_BOT_API_URL: ${REACT_APP_BOT_API_URL:-/bot-api}
        REACT_APP_WS_URL: ${REACT_APP_WS_URL:-https://ide.innoprog.ru}
        REACT_APP_PARENT_APP_ORIGIN: ${REACT_APP_PARENT_APP_ORIGIN:-https://app.innoprog.ru}
        REACT_APP_PARENT_POST_MESSAGE_ALLOWED_ORIGINS: ${REACT_APP_PARENT_POST_MESSAGE_ALLOWED_ORIGINS:-https://app.innoprog.ru,https://api.innoprog.ru,https://cabinet.innoprog.ru}
      labels:
        org.opencontainers.image.revision: ${FRONTEND_IMAGE_REVISION:?FRONTEND_IMAGE_REVISION is required}
    container_name: ide-frontend-1
    labels:
      org.opencontainers.image.revision: ${FRONTEND_IMAGE_REVISION:?FRONTEND_IMAGE_REVISION is required}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    user: "101:101"
    pids_limit: 128
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /etc/nginx/conf.d:rw,noexec,nosuid,nodev,size=1m,mode=0755,uid=101,gid=101
      - /run:rw,noexec,nosuid,nodev,size=1m,mode=0755,uid=101,gid=101
      # Space for eight concurrent maximum-size (10 MiB) buffered requests,
      # with additional headroom for proxy response temp files.
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=128m,mode=0755,uid=101,gid=101
    env_file:
      - /opt/innoprog/apps/INNOPROG-IDE/.env
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
